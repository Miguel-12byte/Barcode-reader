<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitor de Código de Barras PRO</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.video-box{
    background:#1e293b;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:20px;
}

video{
    width:100%;
    display:block;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.codigo{
    font-size:22px;
    color:#22c55e;
    font-weight:bold;
    margin-top:10px;
    word-break:break-all;
}

.lista{
    margin-top:15px;
}

.item{
    background:#334155;
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
}
</style>

</head>
<body>

<div class="container">

<h1>📦 Leitor de Código de Barras PRO</h1>

<div class="video-box">
    <video id="video"></video>
</div>

<button id="btnScanner">
    Iniciar Scanner
</button>

<div class="card">
    <h3>Último Código Lido</h3>
    <div id="resultado" class="codigo">
        Aguardando leitura...
    </div>
</div>

<div class="card">
    <h3>Histórico</h3>
    <div id="historico" class="lista"></div>
</div>

</div>

<script>

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");
const historico = document.getElementById("historico");
const btnScanner = document.getElementById("btnScanner");

const codeReader = new ZXing.BrowserMultiFormatReader();

let scannerAtivo = false;

btnScanner.addEventListener("click", async () => {

    if(scannerAtivo) return;

    scannerAtivo = true;

    try {

        const devices =
            await codeReader.listVideoInputDevices();

        if(devices.length === 0){
            alert("Nenhuma câmera encontrada.");
            return;
        }

        await codeReader.decodeFromVideoDevice(
            devices[0].deviceId,
            video,
            (result, err) => {

                if(result){

                    const codigo = result.text;

                    resultado.innerText = codigo;

                    navigator.vibrate?.(200);

                    adicionarHistorico(codigo);
                }

            }
        );

    } catch(error){

        console.error(error);

        alert(
            "Erro ao acessar a câmera. Verifique as permissões."
        );

    }

});

function adicionarHistorico(codigo){

    const item = document.createElement("div");

    item.className = "item";

    item.innerHTML =
        `<strong>${codigo}</strong><br>
         ${new Date().toLocaleString()}`;

    historico.prepend(item);

}

</script>

</body>
</html>
