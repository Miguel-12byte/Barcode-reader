<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitor de Código de Barras</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
}

video{
    width:100%;
    border-radius:12px;
    background:#000;
    margin-top:20px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
}

.card{
    background:#1e293b;
    padding:15px;
    margin-top:15px;
    border-radius:12px;
}

.codigo{
    font-size:22px;
    color:#22c55e;
    margin-top:10px;
    word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

<h1>📦 Leitor de Código de Barras</h1>

<video id="video"></video>

<button onclick="iniciarScanner()">
Iniciar Scanner
</button>

<div class="card">
<h3>Resultado</h3>
<div id="resultado" class="codigo">
Aguardando leitura...
</div>
</div>

</div>

<script>

const leitor = new ZXing.BrowserMultiFormatReader();

async function iniciarScanner(){

    try{

        const devices =
            await leitor.listVideoInputDevices();

        if(devices.length === 0){
            alert("Nenhuma câmera encontrada");
            return;
        }

        leitor.decodeFromVideoDevice(
            devices[0].deviceId,
            "video",
            (result, err) => {

                if(result){

                    document.getElementById(
                        "resultado"
                    ).innerText = result.text;

                    if(navigator.vibrate){
                        navigator.vibrate(200);
                    }
                }
            }
        );

    }catch(e){

        console.error(e);

        alert(
            "Erro ao acessar a câmera. Verifique as permissões."
        );
    }
}

</script>

</body>
</html>
